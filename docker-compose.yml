version: '3.8'

services:
  backend:
    image: 324178491391.dkr.ecr.ap-south-1.amazonaws.com/mern-server:latest
    container_name: mern-backend
    ports:
      - "5000:5000"
    env_file:
      - .env  # We will manually create this file on the EC2 server later

  frontend:
    image: 324178491391.dkr.ecr.ap-south-1.amazonaws.com/mern-client:latest
    container_name: mern-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend