version: '3.8'

services:
  backend:
    image: 324178491391.dkr.ecr.ap-south-1.amazonaws.com/mern-server:${SERVER_VERSION}
    container_name: mern-backend
    ports:
      - "5000:5000"
    env_file:
      - .env

  frontend:
    image: 324178491391.dkr.ecr.ap-south-1.amazonaws.com/mern-client:${CLIENT_VERSION}
    container_name: mern-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend